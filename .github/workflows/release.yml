name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & publish DMG
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          /usr/libexec/PlistBuddy -c "Set CFBundleShortVersionString $VERSION" Resources/Info.plist
          /usr/libexec/PlistBuddy -c "Set CFBundleVersion $GITHUB_RUN_NUMBER" Resources/Info.plist

      - name: Build app and DMG
        run: ./build.sh

      - name: Checksum
        run: |
          cd dist
          cp AppSweep.dmg "AppSweep-${GITHUB_REF_NAME}.dmg"
          shasum -a 256 AppSweep.dmg > AppSweep.dmg.sha256

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: AppSweep ${{ github.ref_name }}
          body_path: .github/RELEASE_NOTES.md
          files: |
            dist/AppSweep.dmg
            dist/AppSweep-${{ github.ref_name }}.dmg
            dist/AppSweep.dmg.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppSweep-dmg
          path: dist/AppSweep.dmg
